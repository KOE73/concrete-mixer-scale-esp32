<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mixer Process</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Mixer Process</h1>
    <nav class="top-nav">
      <a href="/">Main</a>
    </nav>

    <section class="process-summary">
      <div>
        <span>Stage</span>
        <strong id="stage">--</strong>
      </div>
      <div>
        <span>Current</span>
        <strong id="weight">--</strong>
      </div>
      <div>
        <span>Target</span>
        <strong id="target">--</strong>
      </div>
      <div>
        <span>Remaining</span>
        <strong id="remaining">--</strong>
      </div>
      <div>
        <span>Shovels</span>
        <strong id="shovels">--</strong>
      </div>
      <div>
        <span>Sample</span>
        <strong id="sample">--</strong>
      </div>
    </section>

    <section class="chart-panel">
      <h2>Live weight</h2>
      <canvas id="weightChart" width="640" height="180"></canvas>
    </section>

    <section class="calibration-panel">
      <div class="section-title-row">
        <h2>Sum calibration</h2>
      </div>
      <div class="calibration-grid" id="calibration"></div>
      <div class="calibration-actions">
        <label>sumOffset
          <input id="sumOffset" type="number" step="1" value="0">
        </label>
        <label>sumScale
          <input id="sumScale" type="number" step="0.000001" value="1">
        </label>
        <button id="saveCalibration" type="button">Save calibration</button>
        <span id="calibrationMessage"></span>
      </div>
      <div class="settings-editor">
        <div>
          <h3>Units</h3>
          <table>
            <thead>
              <tr><th>Name</th><th>Raw/unit</th><th></th></tr>
            </thead>
            <tbody id="unitsEditor"></tbody>
          </table>
          <div class="inline-editor">
            <input id="newUnitName" type="text" maxlength="5" placeholder="unit">
            <input id="newUnitRaw" type="number" step="0.001" placeholder="raw/unit">
            <button id="addUnit" type="button">Add unit</button>
          </div>
        </div>
        <div>
          <h3>Setpoints</h3>
          <table>
            <thead>
              <tr><th>Name</th><th>Raw</th><th></th></tr>
            </thead>
            <tbody id="setpointsEditor"></tbody>
          </table>
          <div class="inline-editor">
            <input id="newSetpointName" type="text" maxlength="24" placeholder="name">
            <input id="newSetpointRaw" type="number" step="1" placeholder="raw">
            <button id="addSetpoint" type="button">Add point</button>
          </div>
        </div>
      </div>
    </section>

    <section class="process-grid">
      <div>
        <h2>MA</h2>
        <table>
          <thead>
            <tr><th>MA</th><th>Valid</th><th>Raw sum</th><th>Weight</th></tr>
          </thead>
          <tbody id="filters"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/cbor-x.min.js"></script>
  <script src="/cbor.js"></script>
  <script src="/process.js"></script>
</body>
</html>
