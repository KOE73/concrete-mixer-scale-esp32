<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mixer Scale</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Mixer Scale</h1>
    <nav class="top-nav">
      <a href="/process.html">Process view</a>
    </nav>
    <div class="weight" id="weight">--</div>
    <section class="target">
      <div>
        <span>Этап</span>
        <strong id="stage">--</strong>
      </div>
      <div>
        <span>Осталось</span>
        <strong id="remaining">--</strong>
      </div>
      <div>
        <span>Лопат</span>
        <strong id="shovels">--</strong>
      </div>
    </section>
    <section class="wifi">
      <h2>Wi-Fi</h2>
      <div class="wifi-status">
        <div>
          <span>Точка</span>
          <strong id="apSsid">--</strong>
        </div>
        <div>
          <span>Сеть</span>
          <strong id="staState">--</strong>
        </div>
        <div>
          <span>IP</span>
          <strong id="staIp">--</strong>
        </div>
      </div>
      <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
        <button type="button" id="btnScan" style="width: auto; margin-top: 0; min-height: 32px; background: #27272a; border-color: #3f3f46; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px;">🔍 Поиск сетей</button>
        <span id="scanStatus" style="font-size: 13px; color: #a1a1aa;"></span>
      </div>
      <div id="scanResults" style="display: none; margin-bottom: 16px; background: rgba(0,0,0,0.3); border: 1px solid #27272a; padding: 8px; border-radius: 6px;">
        <ul id="scanList" style="list-style: none; padding-left: 0; margin: 0; max-height: 160px; overflow-y: auto;">
        </ul>
      </div>
      <form id="wifiForm">
        <label>
          SSID
          <input id="wifiSsid" name="ssid" maxlength="32" autocomplete="off">
        </label>
        <label>
          Пароль
          <input id="wifiPassword" name="password" type="password" maxlength="64" autocomplete="new-password">
        </label>
        <button type="submit">Сохранить</button>
        <span id="wifiMessage"></span>
      </form>
      <div id="savedNetworks" class="saved-networks" style="margin-top: 15px; display: none;">
        <h3 style="font-size: 1.1em; margin-bottom: 8px;">Сохраненные сети:</h3>
        <ul id="networksList" style="list-style: none; padding-left: 0;">
        </ul>
      </div>
    </section>
    <section class="wifi">
      <h2>UDP CSV</h2>
      <div class="wifi-status">
        <div>
          <span>Весы</span>
          <strong id="udpScaleId">--</strong>
        </div>
        <div>
          <span>Адрес</span>
          <strong id="udpTarget">--</strong>
        </div>
        <div>
          <span>Статус</span>
          <strong id="udpEnabled">--</strong>
        </div>
      </div>
      <form id="udpForm">
        <label>
          Scale ID
          <input id="udpScaleIdInput" name="scaleId" type="number" min="1" step="1">
        </label>
        <label>
          Адрес
          <input id="udpTargetHost" name="targetHost" maxlength="63" autocomplete="off">
        </label>
        <label>
          Порт
          <input id="udpPort" name="port" type="number" min="1" max="65535" step="1">
        </label>
        <label>
          <input id="udpEnabledInput" name="enabled" type="checkbox">
          Включено
        </label>
        <button type="submit">Сохранить UDP</button>
        <span id="udpMessage"></span>
      </form>
    </section>
    <footer class="device-info">
      <span>AP MAC <strong id="apMac">--</strong></span>
      <span>STA MAC <strong id="staMac">--</strong></span>
    </footer>
  </main>
  <script src="/cbor-x.min.js"></script>
  <script src="/cbor.js"></script>
  <script src="/app.js"></script>
</body>
</html>
